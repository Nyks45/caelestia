# ### Hyprland ###
# Apps
$terminal = foot
$browser = zen-browser
$editor = gnome-text-editor
$fileExplorer = nautilus

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 0.3
$workspaceSwipeFingers = 4
$gestureFingers = 3
$gestureFingersMore = 4

# Blur
$blurEnabled = false
$blurSpecialWs = false
$blurPopups = true
$blurInputMethods = true
$blurSize = 5
$blurPasses = 1
$blurXray = false

# Shadow
$shadowEnabled = false
$shadowRange = 20
$shadowRenderPower = 2
$shadowColourAlpha = d4
$shadowColour = rgba($shadow$shadowColourAlpha)

# Gaps
$workspaceGaps = 15
$windowGapsIn = 3
$windowGapsOut = 6
$singleWindowGapsOut = 8

# Window styling
$windowRounding = 15

$windowBorderSize = 1
$groupBarAlpha = d4
$activeBorderAlpha = e6
$activeWindowBorderColour = rgba($primary$activeBorderAlpha)
$inactiveBorderAlpha = 11
$inactiveWindowBorderColour = rgba($onSurfaceVariant$inactiveBorderAlpha)

# Misc
$volumeStep = 10  # In percent
$cursorTheme = sweet-cursors
$cursorSize = 26


# ### Keybinds ###
# Workspaces
$kbMoveWinToWs = Super+Alt
$kbMoveWinToWsGroup = Ctrl+Super+Alt
$kbGoToWs = Super
$kbGoToWsGroup = Ctrl+Super

$kbNextWs = Ctrl+Super, right
$kbPrevWs = Ctrl+Super, left

$kbToggleSpecialWs = Super, S

# Window groups
$kbWindowGroupCycleNext = Alt, Tab
$kbWindowGroupCyclePrev = Shift+Alt, Tab
$kbUngroup = Super, U
$kbToggleGroup = Super, Comma

# Window actions
$kbMoveWindow = Super, Z
$kbResizeWindow = Super, X
$kbWindowPip = Super+Alt, Backslash
$kbPinWindow = Super, P
$kbWindowFullscreen = Super, F
$kbWindowBorderedFullscreen = Super+Alt, F
$kbToggleWindowFloating = Super+Alt, Space
$kbCloseWindow = Alt, F4

# Special workspace toggles
$kbSystemMonitor = Ctrl+Shift, Delete
$kbMusic = Super, M
$kbCommunication = Super, D
$kbTodo = Super, R

# Apps
$kbTerminal = Super, T
$kbBrowser = Super, W
$kbEditor = Super, C
$kbFileExplorer = Super, E

# Misc
$kbSession = Ctrl+Alt, Delete
$kbShowSidebar = Super, N
$kbClearNotifs = Ctrl+Alt, C
$kbShowPanels = Super, K
$kbLock = Super, L
$kbRestoreLock = Super+Alt, L
